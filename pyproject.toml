[project]
name = "karkas"
version = "0.1.0"
description = "КАРКАС — ИИ-агент проектирования образовательных программ (хакатон «Точка сборки», кейс №1)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "openai>=1.30",
    "jinja2>=3.1",
    "docxtpl>=0.17",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "pypdf>=4.2",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "orjson>=3.10",
    "PyJWT>=2.8",
    "aiosqlite>=0.20",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "integration: тесты, требующие PostgreSQL/S3 (см. scripts/test_migrations.sh)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.setuptools.packages.find]
include = ["karkas*"]
