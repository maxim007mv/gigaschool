# Профиль A (хакатон): одна ВМ, Docker Compose (Д1 §10).
# Сборка образов в CI; выкладка: docker compose pull && docker compose up -d
services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web_dist:/srv
    depends_on:
      - api

  api:
    image: ${KARKAS_IMAGE:-registry/karkas:latest}
    command: uvicorn karkas.api.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file: ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ${KARKAS_IMAGE:-registry/karkas:latest}
    command: python -m karkas.worker --concurrency 8
    env_file: ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    image: ${KARKAS_IMAGE:-registry/karkas:latest}
    command: python -m migrations.runner
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: karkas
      POSTGRES_PASSWORD: karkas
      POSTGRES_DB: karkas
    volumes:
      - pg_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - max_connections=200
      - -c
      - work_mem=16MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karkas -d karkas"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pg_data: {}
  web_dist: {}
