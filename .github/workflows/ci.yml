name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]"
      - name: Ruff
        run: |
          .venv/bin/ruff check karkas tests scripts
          .venv/bin/ruff format --check karkas tests scripts
      - name: Mypy (domain)
        run: .venv/bin/mypy karkas/domain
      - name: Pytest
        env:
          PGUSER: postgres
          KARKAS_TEST_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/postgres
        run: .venv/bin/pytest tests --ignore=tests/payments_audit -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Web lint, typecheck, tests
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
