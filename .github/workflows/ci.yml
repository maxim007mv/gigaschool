name: CI

on:
  push:
    branches: [master, "cursor/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]"
      - name: Ruff
        run: |
          .venv/bin/ruff check karkas tests scripts
          .venv/bin/ruff format --check karkas tests scripts
      - name: Mypy (domain)
        run: .venv/bin/mypy karkas/domain
      - name: Pytest
        run: .venv/bin/pytest tests/unit tests/eval --ignore=tests/payments_audit -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Web typecheck
        working-directory: web
        run: |
          npm ci
          npm run typecheck
